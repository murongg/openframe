name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Run lint
        run: pnpm lint

      - name: Generate route tree
        run: pnpm -C apps/ui build

      - name: Type-check applications
        run: |
          pnpm -C apps/desktop exec tsc --noEmit
          pnpm -C apps/web exec tsc --noEmit
          pnpm -C apps/ui exec tsc --noEmit
